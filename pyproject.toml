[project]
name = "vllm-xlstm"
version = "0.1.0"
description = "Out-of-tree vLLM plugin and CUDA-graph engine for NX-AI xLSTM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# Heavy CUDA wheels (torch, xlstm, mlstm_kernels) are pinned in requirements.txt
# so `uv pip install -e .` does not re-resolve against the wrong extra index.
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib"]
vllm = ["vllm"]

[project.scripts]
xlstm-vllm-speed = "vllm_xlstm.cli:main"
xlstm-vllm-speed-tp2 = "vllm_xlstm.cli:main_tp2"

[project.entry-points."vllm.general_plugins"]
register_xlstm = "vllm_xlstm.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vllm_xlstm"]

[tool.hatch.build.targets.wheel.force-include]
"data/speed_prompts.json" = "vllm_xlstm/data/speed_prompts.json"

[tool.uv]
package = true
